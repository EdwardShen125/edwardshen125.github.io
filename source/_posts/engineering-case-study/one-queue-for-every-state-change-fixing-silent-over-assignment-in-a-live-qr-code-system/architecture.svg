<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1060" viewBox="0 0 1500 1060">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#203047}.title{font-size:28px;font-weight:700}.sub{font-size:17px;fill:#526278}.node{font-size:21px;font-weight:700}.body{font-size:16px;fill:#44536b}.edge{font-size:15px;fill:#475569}.tech{font-size:12.5px;font-weight:700;fill:#8a6f43}.leg{font-size:14px;fill:#526278}</style>
<text x="40" y="45" class="title">One queue serializes every membership-changing event</text>
<text x="40" y="78" class="sub">Assignment lives in WeCom's contact-way config; serialized updates keep our state and theirs in agreement</text>

<!-- WeCom boundary (their perimeter) -->
<rect x="30" y="120" width="260" height="700" rx="18" fill="#f0f4f8" stroke="#9aa9b8" stroke-dasharray="8 5"/>
<text x="55" y="150" class="sub">WeCom · connection mechanics</text>

<!-- scan path (never passes through our platform) -->
<path d="M 155 460 L 155 560" fill="none" stroke="#356a8a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="60" y="520" class="edge">scan · never passes us</text>

<g id="wx"><rect x="40" y="330" width="230" height="120" rx="12" fill="white" stroke="#356a8a" stroke-width="2"/>
<text x="58" y="364" class="node">WeChat users</text>
<text x="58" y="396" class="body">Scan campaign QR codes</text>
<text x="58" y="422" class="body">Wait to be connected</text></g>

<g id="wecom"><rect x="40" y="560" width="230" height="190" rx="12" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="58" y="594" class="node">WeCom</text>
<text x="58" y="626" class="body">Contact-way config</text>
<text x="58" y="652" class="body">routes each scan</text>
<text x="58" y="678" class="body">Rate-limited update API</text>
<text x="58" y="704" class="body">Deleted-code error → cleanup</text></g>

<g id="admins"><rect x="360" y="330" width="250" height="120" rx="12" fill="white" stroke="#356a8a" stroke-width="2"/>
<text x="378" y="364" class="node">Tenant admins</text>
<text x="378" y="396" class="body">Edit code members and quotas</text>
<text x="378" y="422" class="body">Go offline / come back</text></g>

<g id="landing"><rect x="710" y="330" width="250" height="120" rx="12" fill="white" stroke="#356a8a" stroke-width="2"/>
<text x="728" y="364" class="node">Landing page</text>
<text x="728" y="396" class="body">Sequenced / quota codes</text>
<text x="728" y="422" class="body">Delegate connect to WeCom</text></g>

<!-- our platform boundary -->
<rect x="330" y="540" width="1140" height="330" rx="18" fill="#f8f4ec" stroke="#c0aa7e" stroke-dasharray="8 5"/>
<text x="355" y="570" class="sub">Our platform · one serial pipeline per tenant</text>

<g id="callback"><rect x="360" y="600" width="250" height="190" rx="12" fill="white" stroke="#8a6d3b" stroke-width="2"/>
<text x="378" y="634" class="node">Event sources</text>
<text x="378" y="666" class="body">Scan callback → quota $inc</text>
<text x="378" y="692" class="body">Offline toggle · work hours</text>
<text x="378" y="718" class="body">Resignation · org changes</text>
<text x="378" y="744" class="body">Code edited</text></g>

<g id="kafka"><rect x="710" y="600" width="250" height="190" rx="12" fill="white" stroke="#8a6d3b" stroke-width="2"/>
<text x="728" y="634" class="node">Kafka topic</text>
<text x="728" y="666" class="body">One queue, every event</text>
<text x="728" y="692" class="body">Keyed by tenant ID</text>
<text x="728" y="718" class="body">Same key → one goroutine</text>
<text x="728" y="744" class="body">24 h message TTL</text></g>

<g id="consumer"><rect x="1060" y="600" width="260" height="190" rx="12" fill="white" stroke="#8a6d3b" stroke-width="2"/>
<text x="1078" y="634" class="node">Serial consumer</text>
<text x="1078" y="666" class="body">Recompute member list</text>
<text x="1078" y="692" class="body">Per-tenant token bucket</text>
<text x="1078" y="718" class="body">Fast / slow lanes</text>
<text x="1078" y="744" class="body">Not-done → the queue redelivers</text></g>

<g id="mongo"><rect x="1180" y="900" width="260" height="110" rx="12" fill="white" stroke="#a44a7f" stroke-width="2"/>
<text x="1198" y="934" class="node">MongoDB per tenant</text>
<text x="1198" y="966" class="body">Staff flags · quota ceilings</text>
<text x="1198" y="992" class="body">Records what was pushed</text></g>

<g id="redis"><rect x="880" y="900" width="280" height="110" rx="12" fill="white" stroke="#a44a7f" stroke-width="2"/>
<text x="898" y="926" class="node">Redis per tenant</text>
<text x="898" y="956" class="body">Assignment set · token bucket</text>
 <text x="898" y="978" class="body">ZSET + two-level cursor</text>
 <text x="898" y="1000" class="body">Landing page draws via Lua</text></g>

<path d="M 960 430 L 990 430 L 990 900" fill="none" stroke="#a44a7f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="1002" y="690" class="edge" transform="rotate(90 1002 690)">draw next staff</text>
<!-- edges -->
<path d="M 270 745 L 360 745" fill="none" stroke="#8a6d3b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="275" y="733" class="edge">customer added</text>
<path d="M 455 450 L 490 600" fill="none" stroke="#356a8a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="500" y="530" class="edge">membership events</text>
<path d="M 835 330 L 835 300 L 300 300 L 300 690 L 270 690" fill="none" stroke="#356a8a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="330" y="288" class="edge">delegate connect · landing page yields to a per-person code</text>
<path d="M 610 700 L 710 700" fill="none" stroke="#8a6d3b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="620" y="682" class="edge">tenant-keyed</text>
<path d="M 960 700 L 1060 700" fill="none" stroke="#8a6d3b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="966" y="682" class="edge">serial per key</text>
<path d="M 1190 790 L 1190 900" fill="none" stroke="#a44a7f" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 1140 790 L 1140 900" fill="none" stroke="#a44a7f" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1005" y="855" class="edge">rebuild set</text>
<text x="1208" y="855" class="edge">write-back</text>
<!-- push to WeCom: the routing-truth write, out of our boundary into theirs -->
<path d="M 1100 790 L 1100 885 L 155 885 L 155 750" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="520" y="875" class="edge">update contact-way · WeCom gets the correct list first</text>

<!-- legend -->
<line x1="40" y1="1010" x2="70" y2="1010" stroke="#356a8a" stroke-width="2.5"/><text x="76" y="1015" class="leg">scan / admin flow</text>
<line x1="230" y1="1010" x2="260" y2="1010" stroke="#8a6d3b" stroke-width="2.5"/><text x="266" y="1015" class="leg">state-change events</text>
<line x1="460" y1="1010" x2="490" y2="1010" stroke="#64748b" stroke-width="2.5"/><text x="496" y="1015" class="leg">WeCom API write</text>
<line x1="660" y1="1010" x2="690" y2="1010" stroke="#a44a7f" stroke-width="2.5"/><text x="696" y="1015" class="leg">store write-back</text>
<text x="40" y="1045" class="leg">30,000 tenants keyed by ID: per-tenant serialization, cross-tenant parallel</text>
</svg>