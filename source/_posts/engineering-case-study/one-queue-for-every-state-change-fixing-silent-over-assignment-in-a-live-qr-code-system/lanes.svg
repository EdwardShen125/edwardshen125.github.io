<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="725" viewBox="0 0 1500 725">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#203047}.title{font-size:28px;font-weight:700}.sub{font-size:17px;fill:#526278}.node{font-size:21px;font-weight:700}.body{font-size:16px;fill:#44536b}.edge{font-size:15px;fill:#475569}.leg{font-size:14px;fill:#526278}</style>
<text x="40" y="45" class="title">Two lanes, two cadences — one rate window</text>
<text x="40" y="78" class="sub">A stateless function demotes selected codes to slow; spaced pushes, still one writer</text>

<!-- our platform boundary -->
<rect x="30" y="100" width="1130" height="510" rx="18" fill="#f8f4ec" stroke="#c0aa7e" stroke-dasharray="8 5"/>
<text x="55" y="130" class="sub">Our platform</text>

<g id="fasttopic"><rect x="80" y="150" width="230" height="110" rx="12" fill="white" stroke="#8a6d3b" stroke-width="2"/>
<text x="98" y="184" class="node">Fast topic</text>
<text x="98" y="216" class="body">Every event · code-keyed</text></g>

<g id="consumer"><rect x="440" y="150" width="280" height="120" rx="12" fill="white" stroke="#8a6d3b" stroke-width="2"/>
<text x="458" y="184" class="node">Serial consumer</text>
<text x="458" y="216" class="body">Pure lane function, no state</text>
<text x="458" y="242" class="body">code age · tenant whitelist</text></g>

<g id="pushgate"><rect x="850" y="150" width="280" height="120" rx="12" fill="white" stroke="#a44a7f" stroke-width="2"/>
<text x="868" y="184" class="node">Push path · both lanes</text>
<text x="868" y="216" class="body">per-code lock · dedupe</text>
<text x="868" y="242" class="body">tenant token bucket</text></g>

<g id="slowtopic"><rect x="80" y="480" width="230" height="110" rx="12" fill="white" stroke="#8a6d3b" stroke-width="2"/>
<text x="98" y="514" class="node">Slow topic</text>
<text x="98" y="546" class="body">Republished, no call</text></g>

<g id="slowworkers"><rect x="440" y="480" width="280" height="120" rx="12" fill="white" stroke="#8a6d3b" stroke-width="2"/>
<text x="458" y="514" class="node">Slow workers</text>
<text x="458" y="546" class="body">Sleep between pushes</text>
<text x="458" y="572" class="body">seconds · own worker set</text></g>

<g id="retry"><rect x="850" y="480" width="280" height="120" rx="12" fill="white" stroke="#8a6d3b" stroke-width="2"/>
<text x="868" y="514" class="node">Retry topic</text>
<text x="868" y="546" class="body">no token → ack not-done</text>
<text x="868" y="572" class="body">re-enters the same key</text></g>

<g id="wecom"><rect x="1250" y="170" width="230" height="110" rx="12" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="1268" y="204" class="node">WeCom</text>
<text x="1268" y="236" class="body">contact-way config</text>
<text x="1268" y="262" class="body">latest list wins</text></g>

<!-- edges -->
<path d="M 310 210 L 440 210" fill="none" stroke="#8a6d3b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="316" y="196" class="edge">per-key goroutine</text>

<path d="M 720 230 L 850 230" fill="none" stroke="#8a6d3b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="732" y="218" class="edge">fast: push now</text>

<path d="M 490 270 L 490 400 L 195 400 L 195 480" fill="none" stroke="#8a6d3b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="205" y="388" class="edge">says slow → republish</text>

<path d="M 310 545 L 440 545" fill="none" stroke="#8a6d3b" stroke-width="2.5" marker-end="url(#arrow)"/>

<path d="M 720 545 L 900 545 L 900 270" fill="none" stroke="#8a6d3b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="728" y="533" class="edge">rejoins push path</text>

<path d="M 1130 240 L 1250 240" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1140" y="228" class="edge">token → push</text>

<path d="M 970 270 L 970 480" fill="none" stroke="#8a6d3b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="988" y="383" class="edge">no token</text>

<path d="M 970 600 L 970 650 L 40 650 L 40 210 L 80 210" fill="none" stroke="#8a6d3b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="400" y="671" class="edge">after the delay → same key</text>

<text x="40" y="700" class="leg">Ordering per code · one rate window per tenant · a sleeping slow worker never delays fast</text>
</svg>
