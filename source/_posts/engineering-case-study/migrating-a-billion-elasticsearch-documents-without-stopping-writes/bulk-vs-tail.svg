<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="'JetBrains Mono','Menlo',monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="k-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#fbbf24"/>
    </marker>
    <marker id="k-violet" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#a78bfa"/>
    </marker>
  </defs>
  <rect width="1200" height="360" fill="#020617"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <text x="32" y="42" fill="#e2e8f0" font-size="16">_reindex: one point-in-time scan</text>

  <!-- live writes -->
  <path d="M 150 96 L 340 96" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#k-amber)"/>
  <text x="150" y="84" fill="#fbbf24" font-size="10">live writes</text>

  <!-- source -->
  <rect x="100" y="130" width="560" height="140" rx="6" fill="#0f172a"/>
  <rect x="100" y="130" width="560" height="140" rx="6" fill="rgba(76,29,149,0.35)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="120" y="154" fill="#e2e8f0" font-size="12">tasks_v1</text>

  <g fill="#a78bfa">
    <circle cx="135" cy="192" r="5"/><circle cx="165" cy="192" r="5"/><circle cx="195" cy="192" r="5"/>
    <circle cx="225" cy="192" r="5"/><circle cx="255" cy="192" r="5"/><circle cx="285" cy="192" r="5"/>
    <circle cx="315" cy="192" r="5"/><circle cx="345" cy="192" r="5"/><circle cx="375" cy="192" r="5"/>
    <circle cx="405" cy="192" r="5"/><circle cx="435" cy="192" r="5"/>
  </g>
  <text x="285" y="226" fill="#94a3b8" font-size="10" text-anchor="middle">copied</text>

  <g fill="#475569">
    <circle cx="505" cy="192" r="5"/><circle cx="535" cy="192" r="5"/><circle cx="565" cy="192" r="5"/>
    <circle cx="595" cy="192" r="5"/><circle cx="625" cy="192" r="5"/>
  </g>
  <text x="565" y="226" fill="#fb7185" font-size="10" text-anchor="middle">missed</text>

  <line x1="470" y1="122" x2="470" y2="278" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="482" y="116" fill="#fb7185" font-size="10">t&#8320; snapshot</text>

  <!-- copy -->
  <path d="M 665 200 L 850 200" stroke="#a78bfa" stroke-width="2" marker-end="url(#k-violet)"/>
  <text x="757" y="184" fill="#a78bfa" font-size="10" text-anchor="middle">scroll &#8594; bulk</text>

  <!-- dest -->
  <rect x="855" y="130" width="260" height="140" rx="6" fill="#0f172a"/>
  <rect x="855" y="130" width="260" height="140" rx="6" fill="rgba(76,29,149,0.5)" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="875" y="154" fill="#e2e8f0" font-size="12">tasks_v2</text>
  <g fill="#a78bfa">
    <circle cx="890" cy="192" r="5"/><circle cx="920" cy="192" r="5"/><circle cx="950" cy="192" r="5"/>
    <circle cx="980" cy="192" r="5"/><circle cx="1010" cy="192" r="5"/><circle cx="1040" cy="192" r="5"/>
    <circle cx="1070" cy="192" r="5"/><circle cx="1100" cy="192" r="5"/>
  </g>
  <text x="985" y="226" fill="#94a3b8" font-size="10" text-anchor="middle">t&#8320;, not now</text>
</svg>
