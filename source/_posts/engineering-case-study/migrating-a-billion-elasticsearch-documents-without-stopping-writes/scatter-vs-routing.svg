<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="'JetBrains Mono','Menlo',monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arr-cyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#22d3ee"/>
    </marker>
    <marker id="arr-rose" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#fb7185"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#020617"/>
  <rect width="1200" height="560" fill="url(#grid)"/>
  <text x="32" y="40" fill="#e2e8f0" font-size="16">why routing matters for a per-account index</text>

  <!-- left panel: v1 -->
  <rect x="30" y="70" width="540" height="450" rx="12" fill="rgba(15,23,42,0.85)" stroke="#334155" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="50" y="98" fill="#a78bfa" font-size="13">tasks_v1 — no routing, no sharding plan</text>

  <rect x="195" y="120" width="210" height="52" rx="6" fill="#0f172a"/>
  <rect x="195" y="120" width="210" height="52" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="300" y="142" fill="#e2e8f0" font-size="12" text-anchor="middle">task-list query</text>
  <text x="300" y="160" fill="#94a3b8" font-size="9" text-anchor="middle">account_no = A</text>

  <!-- fan-out arrows to all 6 shards -->
  <path d="M 250 172 C 200 240, 103 260, 103 296" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-rose)"/>
  <path d="M 270 172 C 240 240, 179 260, 179 296" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-rose)"/>
  <path d="M 290 172 C 280 240, 255 260, 255 296" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-rose)"/>
  <path d="M 310 172 C 320 240, 331 260, 331 296" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-rose)"/>
  <path d="M 330 172 C 360 240, 407 260, 407 296" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-rose)"/>
  <path d="M 350 172 C 400 240, 483 260, 483 296" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-rose)"/>
  <text x="300" y="240" fill="#fb7185" font-size="10" text-anchor="middle" paint-order="stroke" stroke="#0f172a" stroke-width="8">fan-out: every shard scanned</text>

  <!-- shards: A docs scattered -->
  <g font-size="9">
    <rect x="70"  y="298" width="66" height="56" rx="4" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="103" y="314" fill="#94a3b8" text-anchor="middle" font-size="9">shard 0</text>
    <circle cx="92" cy="330" r="5" fill="#fbbf24"/><text x="92" y="333" text-anchor="middle" font-size="7" fill="#020617">A</text>
    <circle cx="112" cy="338" r="4" fill="#475569"/>
    <rect x="146" y="298" width="66" height="56" rx="4" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="179" y="314" fill="#94a3b8" text-anchor="middle" font-size="9">shard 1</text>
    <circle cx="170" cy="336" r="4" fill="#475569"/><circle cx="190" cy="330" r="4" fill="#475569"/>
    <rect x="222" y="298" width="66" height="56" rx="4" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="255" y="314" fill="#94a3b8" text-anchor="middle" font-size="9">shard 2</text>
    <circle cx="238" cy="334" r="4" fill="#475569"/>
    <circle cx="262" cy="330" r="5" fill="#fbbf24"/><text x="262" y="333" text-anchor="middle" font-size="7" fill="#020617">A</text>
    <rect x="298" y="298" width="66" height="56" rx="4" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="331" y="314" fill="#94a3b8" text-anchor="middle" font-size="9">shard 3</text>
    <circle cx="322" cy="338" r="4" fill="#475569"/><circle cx="342" cy="332" r="4" fill="#475569"/>
    <rect x="374" y="298" width="66" height="56" rx="4" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="407" y="314" fill="#94a3b8" text-anchor="middle" font-size="9">shard 4</text>
    <circle cx="398" cy="330" r="5" fill="#fbbf24"/><text x="398" y="333" text-anchor="middle" font-size="7" fill="#020617">A</text>
    <rect x="450" y="298" width="66" height="56" rx="4" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="483" y="314" fill="#94a3b8" text-anchor="middle" font-size="9">shard 5</text>
    <circle cx="472" cy="336" r="4" fill="#475569"/>
  </g>
  <text x="300" y="392" fill="#94a3b8" font-size="10" text-anchor="middle">A's documents scattered by hash(_id)</text>
  <text x="300" y="410" fill="#94a3b8" font-size="10" text-anchor="middle">most shards hold nothing for A</text>
  <text x="300" y="434" fill="#64748b" font-size="9" text-anchor="middle">cost grows with total shard count —</text>
  <text x="300" y="448" fill="#64748b" font-size="9" text-anchor="middle">scatter is in the data model, not the tuning</text>
  <circle cx="66" cy="500" r="5" fill="#fbbf24"/><text x="80" y="504" fill="#94a3b8" font-size="9">= one account's docs</text>
  <circle cx="230" cy="500" r="4" fill="#475569"/><text x="244" y="504" fill="#94a3b8" font-size="9">= other accounts</text>

  <!-- right panel: v2 -->
  <rect x="630" y="70" width="540" height="450" rx="12" fill="rgba(15,23,42,0.85)" stroke="#334155" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="650" y="98" fill="#a78bfa" font-size="13">tasks_v2 — _routing required, routing = account_no</text>

  <rect x="795" y="120" width="210" height="52" rx="6" fill="#0f172a"/>
  <rect x="795" y="120" width="210" height="52" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="900" y="142" fill="#e2e8f0" font-size="12" text-anchor="middle">task-list query</text>
  <text x="900" y="160" fill="#94a3b8" font-size="9" text-anchor="middle">account_no = A</text>

  <path d="M 870 172 C 860 240, 856 260, 856 294" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr-cyan)"/>
  <path d="M 930 172 C 940 240, 930 260, 930 294" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr-cyan)"/>
  <text x="990" y="228" fill="#22d3ee" font-size="10">routing(A) —</text>
  <text x="990" y="242" fill="#22d3ee" font-size="10">its partition</text>

  <!-- partition group around shards 2-3 -->
  <rect x="816" y="292" width="158" height="68" rx="8" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="895" y="376" fill="#fbbf24" font-size="9" text-anchor="middle">A's partition — routing_partition_size=2</text>

  <g font-size="9">
    <rect x="670" y="298" width="66" height="56" rx="4" fill="rgba(76,29,149,0.15)" stroke="#475569" stroke-width="1"/>
    <text x="703" y="314" fill="#64748b" text-anchor="middle" font-size="9">shard 0</text>
    <rect x="746" y="298" width="66" height="56" rx="4" fill="rgba(76,29,149,0.15)" stroke="#475569" stroke-width="1"/>
    <text x="779" y="314" fill="#64748b" text-anchor="middle" font-size="9">shard 1</text>
    <rect x="822" y="298" width="66" height="56" rx="4" fill="rgba(76,29,149,0.55)" stroke="#c4b5fd" stroke-width="2"/>
    <text x="855" y="314" fill="#e2e8f0" text-anchor="middle" font-size="9">shard 2</text>
    <circle cx="840" cy="330" r="5" fill="#fbbf24"/><text x="840" y="333" text-anchor="middle" font-size="7" fill="#020617">A</text>
    <circle cx="864" cy="340" r="5" fill="#fbbf24"/><text x="864" y="343" text-anchor="middle" font-size="7" fill="#020617">A</text>
    <rect x="898" y="298" width="66" height="56" rx="4" fill="rgba(76,29,149,0.55)" stroke="#c4b5fd" stroke-width="2"/>
    <text x="931" y="314" fill="#e2e8f0" text-anchor="middle" font-size="9">shard 3</text>
    <circle cx="918" cy="332" r="5" fill="#fbbf24"/><text x="918" y="335" text-anchor="middle" font-size="7" fill="#020617">A</text>
    <rect x="974" y="298" width="66" height="56" rx="4" fill="rgba(76,29,149,0.15)" stroke="#475569" stroke-width="1"/>
    <text x="1007" y="314" fill="#64748b" text-anchor="middle" font-size="9">shard 4</text>
    <rect x="1050" y="298" width="66" height="56" rx="4" fill="rgba(76,29,149,0.15)" stroke="#475569" stroke-width="1"/>
    <text x="1083" y="314" fill="#64748b" text-anchor="middle" font-size="9">shard 5</text>
  </g>
  <text x="900" y="404" fill="#94a3b8" font-size="10" text-anchor="middle">an account's documents colocated on its partition</text>
  <text x="900" y="422" fill="#94a3b8" font-size="10" text-anchor="middle">82 shards in production; a query touches its 2-shard partition</text>
  <text x="900" y="446" fill="#64748b" font-size="9" text-anchor="middle">a heavy account's write load spreads across two shards,</text>
  <text x="900" y="460" fill="#64748b" font-size="9" text-anchor="middle">never concentrates on one</text>

  <text x="600" y="548" fill="#64748b" font-size="9" text-anchor="middle">same query, same data — the data model decides whether it is a scatter or a point</text>
</svg>
