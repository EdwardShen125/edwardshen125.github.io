<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="'JetBrains Mono','Menlo',monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="m-cyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#22d3ee"/>
    </marker>
    <marker id="m-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#fbbf24"/>
    </marker>
    <marker id="m-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#34d399"/>
    </marker>
    <marker id="m-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#fb923c"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#020617"/>
  <rect width="1200" height="640" fill="url(#grid)"/>
  <text x="32" y="40" fill="#e2e8f0" font-size="16">one Redis key, three modes — reads and writes switch separately</text>

  <!-- column headers -->
  <g font-size="11">
    <text x="150" y="88" fill="#94a3b8">reads</text>
    <text x="620" y="88" fill="#94a3b8">direct writes (business code)</text>
    <text x="1000" y="88" fill="#94a3b8">CDC consumer</text>
  </g>

  <!-- index boxes reused per lane -->
  <!-- lane template: y base 110, lane height 150 -->

  <!-- MODE 0 -->
  <text x="32" y="140" fill="#e2e8f0" font-size="13">mode 0</text>
  <text x="32" y="158" fill="#64748b" font-size="9">default, safe</text>
  <rect x="120" y="115" width="150" height="46" rx="6" fill="#0f172a"/>
  <rect x="120" y="115" width="150" height="46" rx="6" fill="rgba(76,29,149,0.4)" stroke="#c4b5fd" stroke-width="2"/>
  <text x="195" y="143" fill="#e2e8f0" font-size="12" text-anchor="middle">read tasks_v1</text>
  <rect x="560" y="115" width="170" height="46" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="645" y="143" fill="#e2e8f0" font-size="12" text-anchor="middle">write tasks_v1</text>
  <rect x="950" y="115" width="200" height="46" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="1050" y="136" fill="#e2e8f0" font-size="11" text-anchor="middle">v1 + v2</text>
  <text x="1050" y="151" fill="#94a3b8" font-size="9" text-anchor="middle">since Aug 13</text>
  <path d="M 490 138 L 555 138" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#m-amber)"/>
  <text x="300" y="143" fill="#94a3b8" font-size="9">rollback: none needed</text>

  <!-- MODE 1 -->
  <text x="32" y="290" fill="#e2e8f0" font-size="13">mode 1</text>
  <text x="32" y="308" fill="#64748b" font-size="9">v6 serving</text>
  <rect x="120" y="265" width="150" height="46" rx="6" fill="#0f172a"/>
  <rect x="120" y="265" width="150" height="46" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="2"/>
  <text x="195" y="293" fill="#e2e8f0" font-size="12" text-anchor="middle">read tasks_v2</text>
  <rect x="560" y="265" width="170" height="46" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="645" y="286" fill="#e2e8f0" font-size="11" text-anchor="middle">still v1 only</text>
  <text x="645" y="301" fill="#94a3b8" font-size="9" text-anchor="middle">no routing contract yet</text>
  <rect x="950" y="265" width="200" height="46" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="1050" y="286" fill="#e2e8f0" font-size="11" text-anchor="middle">v1 + v2</text>
  <text x="1050" y="301" fill="#94a3b8" font-size="9" text-anchor="middle">v2's only writer</text>
  <path d="M 490 288 L 555 288" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#m-amber)"/>
  <path d="M 950 318 C 900 360, 700 360, 645 318" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#m-orange)"/>
  <text x="797" y="372" fill="#fdba74" font-size="9" text-anchor="middle" paint-order="stroke" stroke="#0f172a" stroke-width="6">v2 freshness = CDC lag (seconds)</text>
  <text x="300" y="293" fill="#94a3b8" font-size="9">rollback: 1&#8594;0 anytime</text>
  <text x="300" y="307" fill="#64748b" font-size="9">(v1 mirror fully alive)</text>

  <!-- MODE 2 -->
  <text x="32" y="440" fill="#e2e8f0" font-size="13">mode 2</text>
  <text x="32" y="458" fill="#64748b" font-size="9">Sep 9</text>
  <rect x="120" y="415" width="150" height="46" rx="6" fill="#0f172a"/>
  <rect x="120" y="415" width="150" height="46" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="2"/>
  <text x="195" y="443" fill="#e2e8f0" font-size="12" text-anchor="middle">read tasks_v2</text>
  <rect x="560" y="415" width="170" height="46" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="2"/>
  <text x="645" y="436" fill="#e2e8f0" font-size="11" text-anchor="middle">write v2 + routing</text>
  <text x="645" y="451" fill="#94a3b8" font-size="9" text-anchor="middle">sync restored Sep 9</text>
  <rect x="950" y="415" width="200" height="46" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="1050" y="436" fill="#e2e8f0" font-size="11" text-anchor="middle">v2 only</text>
  <text x="1050" y="451" fill="#94a3b8" font-size="9" text-anchor="middle">+ create-only bootstrap</text>
  <path d="M 490 438 L 555 438" stroke="#34d399" stroke-width="1.5" marker-end="url(#m-green)"/>
  <rect x="560" y="480" width="170" height="34" rx="6" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="645" y="501" fill="#64748b" font-size="10" text-anchor="middle">v1: stopped, backfill only</text>
  <text x="300" y="443" fill="#94a3b8" font-size="9">rollback: needs backfill</text>
  <text x="300" y="457" fill="#64748b" font-size="9">(v1 no longer written)</text>

  <!-- clamp note -->
  <rect x="120" y="545" width="1030" height="66" rx="8" fill="rgba(136,19,55,0.15)" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="140" y="570" fill="#fb7185" font-size="10">guard: until the direct-write routing contract exists, the clamp function returns mode 0 for ANY configured value —</text>
  <text x="140" y="586" fill="#fb7185" font-size="10">a read/write split is unreachable by misconfiguration. Redis errors / unparsable values also fall back to mode 0.</text>
</svg>
