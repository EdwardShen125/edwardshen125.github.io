<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#203047}.title{font-size:28px;font-weight:700}.sub{font-size:17px;fill:#526278}.node{font-size:21px;font-weight:700}.body{font-size:17px}.edge{font-size:15px;fill:#475569}</style>
<text x="40" y="45" class="title">Rooms own state; systems run serially inside each room</text>
<text x="40" y="78" class="sub">Go schedules independent room goroutines across available processors</text>
<rect x="300" y="290" width="1160" height="560" rx="18" fill="#f0f4f8" stroke="#9aa9b8" stroke-dasharray="8 5"/>
<text x="325" y="320" class="sub">One Go server instance · repeated across the fleet</text>
<path id="commands" d="M 260 400 L 330 400" fill="none" stroke="#356a8a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="280" y="382" class="edge">cmds</text>
<path id="input" d="M 570 425 L 660 425" fill="none" stroke="#356a8a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="582" y="407" class="edge">input batch</text>
<path id="placement" d="M 570 195 L 660 195" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="595" y="177" class="edge">place</text>
<path id="lifecycle" d="M 840 260 L 840 350" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="860" y="305" class="edge">assign / recycle</text>
<path id="changes" d="M 1020 425 L 1130 425" fill="none" stroke="#356a8a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1040" y="407" class="edge">changes</text>
<path id="updates" d="M 1280 500 L 1280 660 L 150 660 L 150 500" fill="none" stroke="#356a8a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="350" y="645" class="edge">view updates</text>
<path id="snapshot" d="M 930 620 L 930 765 L 1130 765" fill="none" stroke="#a44a3f" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="960" y="747" class="edge">snapshot</text>
<path id="flush" d="M 1280 830 L 1280 900" fill="none" stroke="#a44a3f" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1300" y="870" class="edge">flush</text>
<g id="clients"><rect x="40" y="350" width="220" height="150" rx="12" fill="white" stroke="#356a8a" stroke-width="2"/>
<text x="58" y="384" class="node">Game clients</text>
<text x="58" y="415" class="body">Player commands</text>
<text x="58" y="445" class="body">Per-view state updates</text>
</g>
<g id="conn"><rect x="330" y="350" width="240" height="150" rx="12" fill="white" stroke="#356a8a" stroke-width="2"/>
<text x="348" y="384" class="node">Connection layer</text>
<text x="348" y="415" class="body">Game protocol</text>
<text x="348" y="445" class="body">Batch inputs per tick</text>
</g>
<g id="scheduler"><rect x="330" y="130" width="240" height="130" rx="12" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="348" y="164" class="node">Fleet scheduler</text>
<text x="348" y="195" class="body">Track instance load</text>
<text x="348" y="225" class="body">Place new rooms</text>
</g>
<g id="pool"><rect x="660" y="130" width="360" height="130" rx="12" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="678" y="164" class="node">Room pool</text>
<text x="678" y="195" class="body">Pre-allocate and reuse rooms</text>
<text x="678" y="225" class="body">Match player level and intent</text>
</g>
<g id="rooms"><rect x="660" y="350" width="360" height="270" rx="12" fill="white" stroke="#8a6d3b" stroke-width="2"/>
<text x="678" y="384" class="node">Room goroutines</text>
<text x="678" y="415" class="body">One owner of mutable state per room</text>
<text x="678" y="445" class="body">50 ms interval / 20 Hz</text>
<text x="678" y="475" class="body">Serial systems query matching entities</text>
<text x="678" y="505" class="body">Entity-indexed component arrays</text>
<text x="678" y="535" class="body">Room population caps</text>
</g>
<g id="aoi"><rect x="1130" y="350" width="300" height="150" rx="12" fill="white" stroke="#356a8a" stroke-width="2"/>
<text x="1148" y="384" class="node">AOI broadcast</text>
<text x="1148" y="415" class="body">Filter changes by player visibility</text>
<text x="1148" y="445" class="body">Bound fanout within each room</text>
</g>
<g id="snapshot"><rect x="1130" y="700" width="300" height="130" rx="12" fill="white" stroke="#a44a3f" stroke-width="2"/>
<text x="1148" y="734" class="node">Async snapshots</text>
<text x="1148" y="765" class="body">Periodic flush outside the tick</text>
<text x="1148" y="795" class="body">Recent updates may be lost</text>
</g>
<g id="mongo"><rect x="1130" y="900" width="300" height="90" rx="12" fill="white" stroke="#a44a3f" stroke-width="2"/>
<text x="1148" y="934" class="node">MongoDB</text>
<text x="1148" y="965" class="body">Restore last persisted snapshot</text>
</g>
<text x="40" y="1008" class="sub">Observed fleet: 20+ instances · ~200,000 peak concurrent players · over one million DAU</text></svg>